[build-system]
requires = [ "advsetuptools @ git+https://github.com/MineFartS/advsetuptools",]
build-backend = "setuptools.build_meta"

[project]
name = "philh_myftp_biz"
requires-python = ">=3.12"
dynamic = [ "dependencies", "version", ]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
ignore = [ "F401", "E731", "E402", "E701", "E722", "F403", "I001", "B006", "B023", "B018", "UP035", "PLW0602", "UP029", "LOG015", "N999", "BLE001", "RUF013", "RUF012", "SIM114", "PLW1510", "PLR1704", "PYI034",]

[tool.setuptools.package-data]
"*" = [ "*.pyd", "*.so", "*.pyi",]

[tool.setuptools.packages.find]
where = [ ".",]
namespaces = true
exclude = [ "**/__pycache__", "*.pyc",]

[tool.setuptools.dynamic.dependencies]
file = [ "requirements.txt",]
