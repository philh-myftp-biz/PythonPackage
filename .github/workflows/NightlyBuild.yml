name: Nightly Build

on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * *' # Runs daily at 22:00 EST

jobs:

  scan-changes:
    runs-on: ubuntu-latest
    outputs:
      has_changes: ${{ steps.verify.outputs.has_changes }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref || github.repository_default_branch }}
          fetch-depth: 1

      - name: Check Last Commit Message
        id: verify
        run: |
          if [ "$(git log -1 --format="%s")" == "Apply automatic changes" ]; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
          fi

  # =======================================================
  # 🛠️ JOB 1: NATIVE WINDOWS BUILD
  # =======================================================
  build-windows:
    needs: scan-changes
    if: needs.scan-changes.outputs.has_changes == 'true'
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with: 
          python-version: '3.12'

      - name: Compile C++ Extensions In-Place
        run: |
          python -m pip install --upgrade pip setuptools pybind11 build
          python setup.py build_ext --inplace

      - name: Build Windows wheel
        run: python -m build

      - name: Upload Windows Wheel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-dist
          path: dist/*.whl


  # =======================================================
  # 🛠️ JOB 2: CONTAINERIZED LINUX BUILD
  # =======================================================
  build-linux:
    needs: scan-changes
    if: needs.scan-changes.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build and Repair Wheel inside Manylinux Container
        run: |
          docker run --rm -v ${{ github.workspace }}:/io quay.io/pypa/manylinux2014_x86_64 /bin/bash -c "
            cd /io
            /opt/python/cp312-cp312/bin/python -m pip install --upgrade pip setuptools pybind11 build
            /opt/python/cp312-cp312/bin/python setup.py build_ext --inplace
            /opt/python/cp312-cp312/bin/python -m build
            auditwheel repair dist/*-linux_x86_64.whl -w dist/
            rm dist/*-linux_x86_64.whl
          "

      - name: Upload Linux Wheels Artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-dist
          path: dist/*manylinux*.whl


  # =======================================================
  # 🛠️ JOB 3: COMBINE, COMMIT VERSION, TAG COMMIT & PUBLISH
  # =======================================================
  publish:
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create combined deployment directory
        run: mkdir -p dist

      - name: Download Windows Artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-dist
          path: dist/

      - name: Download Linux Artifacts
        uses: actions/download-artifact@v4
        with:
          name: linux-dist
          path: dist/

      - name: Get Current Date
        id: date
        shell: bash
        run: |
          export TZ='America/New_York'
          echo "ISO=$(date +'%Y.%m.%d')" >> $GITHUB_ENV 

      - name: Update version in pyproject.toml
        shell: bash
        run: |
          python -m pip install toml
          python -c "
          from toml import load, dump
          with open('pyproject.toml', 'r') as f:
              data = load(f)
          data['project']['version'] = 'v${{ env.ISO }}'
          with open('pyproject.toml', 'w') as f:
              dump(data, f)
          "

      # Step A: Commit the updated config file to the branch
      - name: Save Changes & Commit Version Bump
        id: commit_step
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: Apply automatic changes
          file_pattern: 'pyproject.toml'
          skip_dirty_check: false 

      # Step B: Securely tag that specific commit locally and push it to GitHub
      - name: Create and Push Git Tag Natively
        run: |
          git tag v${{ env.ISO }}
          git push origin v${{ env.ISO }}

      # Step C: Turn that pushed tag into a formal GitHub Release UI page
      - name: Create GitHub Release
        uses: actions/github-script@v7
        with:
          script: |
            try {
              await github.rest.repos.createRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag_name: 'v${{ env.ISO }}',
                name: 'v${{ env.ISO }}',
                body: 'Automatic Nightly Build',
                draft: false,
                prerelease: false
              });
            } catch (error) {
              core.warning("Release configuration warning: " + error.message);
            }

      - name: Publish all package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          user: __token__
          password: ${{ secrets.PYPI_API_TOKEN }}
          skip-existing: true
