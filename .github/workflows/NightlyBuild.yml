name: Nightly Build

on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * *'

jobs:
  scan-changes:
    runs-on: ubuntu-latest
    outputs:
      has_changes: ${{ steps.verify.outputs.has_changes }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref || github.repository_default_branch }}
          fetch-depth: 1
          submodules: recursive
      - id: verify
        run: |
          if [ "$(git log -1 --format="%s")" == "Apply automatic changes" ]; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
          fi

  prepare-version:
    needs: scan-changes
    if: needs.scan-changes.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version_iso: ${{ env.ISO }}
      commit_sha: ${{ steps.commit.outputs.commit_hash }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref || github.repository_default_branch }}
          submodules: recursive

      - name: Calculate Dynamic Date
        run: |
          export TZ='America/New_York'
          echo "ISO=$(date +'%Y.%m.%d')" >> $GITHUB_ENV

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Patch pyproject.toml
        run: |
          pip install toml
          python -c "
          from toml import load, dump
          with open('pyproject.toml', 'r') as f:
              data = load(f)
          data['project']['version'] = 'v${{ env.ISO }}'
          with open('pyproject.toml', 'w') as f:
              dump(data, f)
          "

      - id: commit
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: Apply automatic changes

  build-wheels:
    needs: prepare-version
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          # Checkout the exact commit hash that contains the version patch
          ref: ${{ needs.prepare-version.outputs.commit_sha }}
          submodules: recursive
      - uses: docker/setup-qemu-action@v3
        if: matrix.os == 'ubuntu-latest'
      - uses: pypa/cibuildwheel@v2.22.0
        env:
          CIBW_BUILD: cp312-win_amd64 cp312-manylinux_x86_64
          CIBW_MANYLINUX_X86_64_IMAGE: manylinux_2_28
      - uses: actions/upload-artifact@v4
        with:
          name: cibw-wheels-${{ matrix.os }}
          path: ./wheelhouse/*.whl

  publish:
    needs: [prepare-version, build-wheels]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare-version.outputs.commit_sha }}
          submodules: recursive
      - run: mkdir -p dist
      - uses: actions/download-artifact@v4
        with:
          pattern: cibw-wheels-*
          path: dist/
          merge-multiple: true
      - uses: actions/setup-python@v5
        with: 
          python-version: '3.12'
      - run: |
          pip install poetry toml
          poetry config virtualenvs.create false
          poetry install --no-root --no-interaction
          
      - uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ needs.prepare-version.outputs.version_iso }}
          name: ${{ needs.prepare-version.outputs.version_iso }}
          body: Automatic Nightly Build
          files: dist/* 
          target_commitish: ${{ needs.prepare-version.outputs.commit_sha }}

      - name: Publish package to PyPI
        env:
          POETRY_PYPI_TOKEN_PYPI: ${{ secrets.PYPI_API_TOKEN }}
        run: poetry publish
